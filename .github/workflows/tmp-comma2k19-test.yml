name: Temporary comma2k19 SunCompass test

on:
  push:
    branches:
      - experiment/metropolis-360-eval

jobs:
  comma-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install opencv-python-headless pyproj

      - name: Fetch comma2k19 public example segment
        run: |
          mkdir -p /tmp/comma
          base='https://raw.githubusercontent.com/commaai/comma2k19/master/Example_1/b0c9d2329ad1606b%7C2018-08-02--08-34-47/40'
          curl -L --fail "$base/preview.png" -o /tmp/comma/preview.png
          curl -L --fail "$base/video.hevc" -o /tmp/comma/video.hevc
          mkdir -p /tmp/comma/global_pose
          for f in frame_gps_times frame_orientations frame_positions frame_times frame_velocities; do
            curl -L --fail "$base/global_pose/$f" -o "/tmp/comma/global_pose/$f"
          done
          ls -lh /tmp/comma /tmp/comma/global_pose

      - name: Run current SunCompass against fused camera-pose ground truth
        run: |
          mkdir -p /tmp/comma_result/frames
          python - <<'PY'
          import csv
          import json
          import math
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import cv2
          import numpy as np
          from PIL import Image
          from pyproj import Transformer

          from suncompass import SunCompass
          from suncompass.add_sun_vector import calculate_sun_vector_ENU

          root = Path("/tmp/comma")
          gp = root / "global_pose"

          gps_times = np.load(gp / "frame_gps_times")
          quats = np.load(gp / "frame_orientations")
          positions = np.load(gp / "frame_positions")
          velocities = np.load(gp / "frame_velocities")
          print("shapes", gps_times.shape, quats.shape, positions.shape, velocities.shape)
          print("gps first", gps_times[0], "quat first", quats[0], "pos first", positions[0])

          def quat2rot(q):
              q0, q1, q2, q3 = map(float, q)
              return np.array([
                  [q0*q0 + q1*q1 - q2*q2 - q3*q3,
                   2*(q1*q2 - q0*q3),
                   2*(q0*q2 + q1*q3)],
                  [2*(q1*q2 + q0*q3),
                   q0*q0 - q1*q1 + q2*q2 - q3*q3,
                   2*(q2*q3 - q0*q1)],
                  [2*(q1*q3 - q0*q2),
                   2*(q0*q1 + q2*q3),
                   q0*q0 - q1*q1 - q2*q2 + q3*q3],
              ], dtype=np.float64)

          ecef_to_geodetic = Transformer.from_crs("EPSG:4978", "EPSG:4979", always_xy=True)
          gps_epoch = datetime(1980, 1, 6, tzinfo=timezone.utc)

          def gps_to_utc(gps):
              week = int(gps[0])
              tow = float(gps[1])
              # GPS-UTC was 18 s throughout 2018.
              return gps_epoch + timedelta(weeks=week, seconds=tow - 18.0)

          def enu_to_ecef(v_enu, lat_deg, lon_deg):
              lat = math.radians(lat_deg)
              lon = math.radians(lon_deg)
              east = np.array([-math.sin(lon), math.cos(lon), 0.0])
              north = np.array([
                  -math.sin(lat)*math.cos(lon),
                  -math.sin(lat)*math.sin(lon),
                  math.cos(lat),
              ])
              up = np.array([
                  math.cos(lat)*math.cos(lon),
                  math.cos(lat)*math.sin(lon),
                  math.sin(lat),
              ])
              return v_enu[0]*east + v_enu[1]*north + v_enu[2]*up

          def wrap_deg(x):
              return (x + 180.0) % 360.0 - 180.0

          cap = cv2.VideoCapture(str(root / "video.hevc"))
          if not cap.isOpened():
              raise RuntimeError("Could not open comma2k19 HEVC video")

          frame_count = min(len(gps_times), len(quats), len(positions))
          wanted = sorted(set(np.linspace(0, frame_count - 1, 16).round().astype(int).tolist()))
          wanted_set = set(wanted)

          compass = SunCompass()
          compass.set_eval(dropout=False)

          rows = []
          idx = 0
          while True:
              ok, bgr = cap.read()
              if not ok:
                  break
              if idx in wanted_set:
                  rgb = cv2.cvtColor(bgr, cv2.COLOR_BGR2RGB)

                  x, y, z = map(float, positions[idx])
                  lon, lat, alt = ecef_to_geodetic.transform(x, y, z)
                  utc = gps_to_utc(gps_times[idx])

                  sun_enu = calculate_sun_vector_ENU(utc, lat, lon)
                  sun_ecef = enu_to_ecef(sun_enu, lat, lon)

                  # comma2k19 README: quaternion rotates ECEF -> local camera
                  # where camera axes are [forward, right, down].
                  R_cam_from_ecef = quat2rot(quats[idx])
                  sun_frd = R_cam_from_ecef @ sun_ecef

                  gt_f = float(sun_frd[0])
                  gt_l = float(-sun_frd[1])
                  gt_u = float(-sun_frd[2])
                  gt_az = math.degrees(math.atan2(gt_l, gt_f))

                  pred = compass.predict(rgb)
                  pred_f, pred_l = map(float, pred[:2])
                  pred_az = math.degrees(math.atan2(pred_l, pred_f))
                  err = wrap_deg(pred_az - gt_az)

                  # Independent sanity check: camera forward axis vs ECEF velocity.
                  # Since R maps ECEF vectors to camera FRD, a forward-moving car
                  # should have positive camera-x velocity and small lateral velocity.
                  vel_cam = R_cam_from_ecef @ np.asarray(velocities[idx], dtype=np.float64)

                  row = {
                      "frame": idx,
                      "utc": utc.isoformat(),
                      "latitude_deg": float(lat),
                      "longitude_deg": float(lon),
                      "altitude_m": float(alt),
                      "camera_velocity_forward_mps": float(vel_cam[0]),
                      "camera_velocity_right_mps": float(vel_cam[1]),
                      "camera_velocity_down_mps": float(vel_cam[2]),
                      "true_sun_f": gt_f,
                      "true_sun_l": gt_l,
                      "true_sun_u": gt_u,
                      "true_relative_azimuth_deg": gt_az,
                      "pred_sun_f": pred_f,
                      "pred_sun_l": pred_l,
                      "pred_magnitude": math.hypot(pred_f, pred_l),
                      "pred_relative_azimuth_deg": pred_az,
                      "signed_azimuth_error_deg": err,
                      "absolute_azimuth_error_deg": abs(err),
                  }
                  rows.append(row)
                  Image.fromarray(rgb).save(
                      f"/tmp/comma_result/frames/frame_{idx:04d}.jpg", quality=92
                  )
                  print(json.dumps(row))
              idx += 1

          if not rows:
              raise RuntimeError("No frames decoded")

          abs_errors = np.array([r["absolute_azimuth_error_deg"] for r in rows])
          signed = np.array([r["signed_azimuth_error_deg"] for r in rows])
          summary = {
              "num_frames": len(rows),
              "decoded_frames": idx,
              "sampled_frames": wanted,
              "mean_absolute_error_deg": float(abs_errors.mean()),
              "median_absolute_error_deg": float(np.median(abs_errors)),
              "p90_absolute_error_deg": float(np.percentile(abs_errors, 90)),
              "min_absolute_error_deg": float(abs_errors.min()),
              "max_absolute_error_deg": float(abs_errors.max()),
              "mean_signed_error_deg": float(signed.mean()),
              "mean_forward_speed_mps": float(np.mean([r["camera_velocity_forward_mps"] for r in rows])),
              "mean_abs_lateral_velocity_mps": float(np.mean(np.abs([r["camera_velocity_right_mps"] for r in rows]))),
          }

          out = Path("/tmp/comma_result")
          with (out / "results.csv").open("w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
              w.writeheader()
              w.writerows(rows)
          with (out / "summary.json").open("w") as f:
              json.dump(summary, f, indent=2)
              f.write("\n")

          print("SUMMARY")
          print(json.dumps(summary, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: comma2k19-suncompass-ground-truth-test
          path: /tmp/comma_result
