name: Temporary Oxford RobotCar SunCompass test

on:
  push:
    branches:
      - experiment/metropolis-360-eval

jobs:
  oxford-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install opencv-python-headless gdown

      - name: Download Oxford Radar RobotCar tiny public sample
        run: |
          mkdir -p /tmp/oxford
          gdown 1C5b2w1DMpSFlAkyVah8Om5IdokJrlcgs -O /tmp/oxford_tiny.zip
          unzip -q /tmp/oxford_tiny.zip -d /tmp/oxford
          echo "Sample files:"
          find /tmp/oxford -maxdepth 5 -type f | head -80

      - name: Run current SunCompass on one real front-camera frame
        run: |
          mkdir -p /tmp/oxford_result
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          import cv2
          import numpy as np
          from PIL import Image

          from suncompass import SunCompass
          from suncompass.add_sun_vector import calculate_sun_vector_relative

          root = Path("/tmp/oxford")
          images = sorted(root.glob("**/stereo/centre/*.png"))
          ins_files = sorted(root.glob("**/gps/ins.csv"))
          if not images:
              raise RuntimeError("No stereo/centre PNG found in Oxford tiny sample")
          if not ins_files:
              raise RuntimeError("No gps/ins.csv found in Oxford tiny sample")

          image_path = images[len(images)//2]
          ins_path = ins_files[0]
          timestamp_us = int(image_path.stem)

          with ins_path.open() as f:
              reader = csv.DictReader(f)
              rows = list(reader)
          if not rows:
              raise RuntimeError("INS CSV was empty")

          row = min(rows, key=lambda r: abs(int(r["timestamp"]) - timestamp_us))
          dt_us = int(row["timestamp"]) - timestamp_us

          lat = float(row["latitude"])
          lon = float(row["longitude"])
          yaw_cw_from_north = float(row["yaw"])

          # Oxford INS uses x=northing, y=easting and yaw in radians, so convert
          # compass-style clockwise-from-north yaw into SunCompass's heading:
          # radians counter-clockwise from East.
          heading_from_east = math.pi / 2.0 - yaw_cw_from_north

          gt = calculate_sun_vector_relative(
              timestamp_us,
              lat,
              lon,
              heading_from_east,
          )
          gt_az_deg = math.degrees(math.atan2(gt[1], gt[0]))

          raw = cv2.imread(str(image_path), cv2.IMREAD_GRAYSCALE)
          if raw is None:
              raise RuntimeError(f"Could not read {image_path}")
          rgb = cv2.cvtColor(raw, cv2.COLOR_BayerGB2RGB)

          compass = SunCompass()
          compass.set_eval(dropout=False)
          pred = compass.predict(rgb)
          pred_f, pred_l = float(pred[0]), float(pred[1])
          pred_az_deg = math.degrees(math.atan2(pred_l, pred_f))

          def wrap_deg(x):
              return (x + 180.0) % 360.0 - 180.0

          error_deg = wrap_deg(pred_az_deg - gt_az_deg)

          velocity_course = None
          try:
              vn = float(row["velocity_north"])
              ve = float(row["velocity_east"])
              if math.hypot(vn, ve) > 0.5:
                  velocity_course = math.atan2(ve, vn)
          except Exception:
              pass

          result = {
              "image": str(image_path),
              "timestamp_us": timestamp_us,
              "nearest_ins_timestamp_us": int(row["timestamp"]),
              "ins_time_delta_us": dt_us,
              "latitude_deg": lat,
              "longitude_deg": lon,
              "ins_yaw_cw_from_north_rad": yaw_cw_from_north,
              "ins_yaw_cw_from_north_deg": math.degrees(yaw_cw_from_north),
              "velocity_course_cw_from_north_deg": (
                  None if velocity_course is None else math.degrees(velocity_course)
              ),
              "true_sun_f": float(gt[0]),
              "true_sun_l": float(gt[1]),
              "true_sun_u": float(gt[2]),
              "true_relative_azimuth_deg": gt_az_deg,
              "pred_sun_f": pred_f,
              "pred_sun_l": pred_l,
              "pred_magnitude": math.hypot(pred_f, pred_l),
              "pred_relative_azimuth_deg": pred_az_deg,
              "signed_azimuth_error_deg": error_deg,
              "absolute_azimuth_error_deg": abs(error_deg),
          }

          out = Path("/tmp/oxford_result")
          Image.fromarray(rgb).save(out / "frame_rgb.jpg", quality=95)
          with (out / "result.json").open("w") as f:
              json.dump(result, f, indent=2)
              f.write("\n")

          print(json.dumps(result, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: oxford-robotcar-suncompass-single-frame
          path: /tmp/oxford_result
